<svg viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500&display=swap');
    </style>
    
    <radialGradient id="bgGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5344;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D4A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C29460;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offsetblur" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Top: Logo Circle -->
  <g>
    <!-- Circle Background -->
    <circle cx="150" cy="100" r="70" fill="url(#bgGradient)" filter="url(#softShadow)"/>
    
    <!-- Outer Gold Ring -->
    <circle cx="150" cy="100" r="70" fill="none" stroke="url(#goldGradient)" stroke-width="2.2"/>
    <circle cx="150" cy="100" r="67.5" fill="none" stroke="#D4A574" stroke-width="0.3" opacity="0.5"/>
    
    <!-- Decorative Accents -->
    <circle cx="165" cy="70" r="5" fill="#D4A574" opacity="0.35"/>
    <circle cx="165" cy="70" r="3.5" fill="none" stroke="#D4A574" stroke-width="0.7" opacity="0.7"/>
    <circle cx="125" cy="125" r="5" fill="#D4A574" opacity="0.35"/>
    <circle cx="125" cy="125" r="3.5" fill="none" stroke="#D4A574" stroke-width="0.7" opacity="0.7"/>
    
    <!-- Kitchen Utensil Element -->
    <g opacity="0.12">
      <path d="M 150 65 L 160 100 L 150 105 L 140 100 Z" fill="#D4A574"/>
      <rect x="147" y="110" width="6" height="15" fill="#D4A574" rx="1.5"/>
    </g>
    
    <!-- Text: TEE -->
    <text x="150" y="115" font-family="Playfair Display, serif" font-size="38" font-weight="700" 
          text-anchor="middle" fill="#FAFAF8" letter-spacing="2">
      TEE
    </text>
    
    <!-- Decorative Lines -->
    <line x1="110" y1="65" x2="190" y2="65" stroke="#D4A574" stroke-width="0.8" opacity="0.5"/>
    <circle cx="110" cy="65" r="1.2" fill="#D4A574"/>
    <circle cx="190" cy="65" r="1.2" fill="#D4A574"/>
    <line x1="115" y1="130" x2="185" y2="130" stroke="#D4A574" stroke-width="0.8" opacity="0.5"/>
    <circle cx="115" cy="130" r="1.2" fill="#D4A574"/>
    <circle cx="185" cy="130" r="1.2" fill="#D4A574"/>
  </g>
  
  <!-- Divider -->
  <line x1="50" y1="160" x2="250" y2="160" stroke="#D4A574" stroke-width="1" opacity="0.3"/>
  
  <!-- Bottom: Brand Text (Stacked) -->
  <g>
    <!-- First Line -->
    <text x="150" y="215" font-family="Playfair Display, serif" font-size="28" font-weight="700" 
          text-anchor="middle" fill="#8B7355" letter-spacing="1">
      TEE
    </text>
    
    <!-- Second Line -->
    <text x="150" y="250" font-family="Playfair Display, serif" font-size="28" font-weight="700" 
          text-anchor="middle" fill="#8B7355" letter-spacing="1">
      CUSTOM
    </text>
    
    <!-- Third Line -->
    <text x="150" y="285" font-family="Playfair Display, serif" font-size="28" font-weight="700" 
          text-anchor="middle" fill="#8B7355" letter-spacing="1">
      KITCHENS
    </text>
    
    <!-- Tagline -->
    <text x="150" y="325" font-family="Cormorant, serif" font-size="14" font-weight="300"
          text-anchor="middle" fill="#D4A574" letter-spacing="2.5" opacity="0.9">
      PRECISION CRAFTSMANSHIP
    </text>
    
    <!-- Decorative Bottom Elements -->
    <line x1="100" y1="345" x2="200" y2="345" stroke="#D4A574" stroke-width="1.2" opacity="0.4"/>
    <circle cx="100" cy="345" r="1.5" fill="#D4A574" opacity="0.6"/>
    <circle cx="150" cy="345" r="1.5" fill="#D4A574" opacity="0.8"/>
    <circle cx="200" cy="345" r="1.5" fill="#D4A574" opacity="0.6"/>
    
    <!-- Bottom corner details -->
    <g opacity="0.25">
      <!-- Bottom left -->
      <line x1="30" y1="410" x2="30" y2="435" stroke="#D4A574" stroke-width="0.8"/>
      <line x1="30" y1="435" x2="55" y2="435" stroke="#D4A574" stroke-width="0.8"/>
      
      <!-- Bottom right -->
      <line x1="245" y1="435" x2="270" y2="435" stroke="#D4A574" stroke-width="0.8"/>
      <line x1="270" y1="410" x2="270" y2="435" stroke="#D4A574" stroke-width="0.8"/>
    </g>
  </g>
</svg>
