<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500&display=swap');
    </style>
    
    <radialGradient id="bgGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5344;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D4A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C29460;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offsetblur" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Mark (Left) -->
  <g>
    <!-- Circle Background -->
    <circle cx="100" cy="150" r="80" fill="url(#bgGradient)" filter="url(#softShadow)"/>
    
    <!-- Outer Gold Ring -->
    <circle cx="100" cy="150" r="80" fill="none" stroke="url(#goldGradient)" stroke-width="2.5"/>
    <circle cx="100" cy="150" r="77" fill="none" stroke="#D4A574" stroke-width="0.4" opacity="0.5"/>
    
    <!-- Decorative Elements -->
    <circle cx="115" cy="120" r="6" fill="#D4A574" opacity="0.35"/>
    <circle cx="115" cy="120" r="4.5" fill="none" stroke="#D4A574" stroke-width="0.8" opacity="0.7"/>
    <circle cx="75" cy="175" r="6" fill="#D4A574" opacity="0.35"/>
    <circle cx="75" cy="175" r="4.5" fill="none" stroke="#D4A574" stroke-width="0.8" opacity="0.7"/>
    
    <!-- Kitchen Element - Subtle -->
    <g opacity="0.12">
      <path d="M 100 110 L 107 145 L 100 150 L 93 145 Z" fill="#D4A574"/>
    </g>
    
    <!-- Text: TEE -->
    <text x="100" y="165" font-family="Playfair Display, serif" font-size="44" font-weight="700" 
          text-anchor="middle" fill="#FAFAF8" letter-spacing="2.5">
      TEE
    </text>
    
    <!-- Decorative Lines -->
    <line x1="50" y1="125" x2="150" y2="125" stroke="#D4A574" stroke-width="1" opacity="0.5"/>
    <circle cx="50" cy="125" r="1.5" fill="#D4A574"/>
    <circle cx="150" cy="125" r="1.5" fill="#D4A574"/>
    <line x1="55" y1="175" x2="145" y2="175" stroke="#D4A574" stroke-width="1" opacity="0.5"/>
    <circle cx="55" cy="175" r="1.5" fill="#D4A574"/>
    <circle cx="145" cy="175" r="1.5" fill="#D4A574"/>
  </g>
  
  <!-- Vertical Separator -->
  <line x1="210" y1="90" x2="210" y2="210" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Brand Text (Right) -->
  <g>
    <!-- Main Brand Name -->
    <text x="280" y="125" font-family="Playfair Display, serif" font-size="48" font-weight="700" 
          fill="#8B7355" letter-spacing="1">
      TEE
    </text>
    
    <text x="280" y="160" font-family="Playfair Display, serif" font-size="48" font-weight="700" 
          fill="#8B7355" letter-spacing="1">
      CUSTOM KITCHENS
    </text>
    
    <!-- Tagline -->
    <text x="280" y="190" font-family="Cormorant, serif" font-size="16" font-weight="300"
          fill="#D4A574" letter-spacing="3" opacity="0.9">
      PRECISION CRAFTSMANSHIP
    </text>
    
    <!-- Decorative underline -->
    <line x1="280" y1="200" x2="750" y2="200" stroke="#D4A574" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Corner Details -->
  <g opacity="0.3">
    <!-- Top right -->
    <line x1="740" y1="70" x2="770" y2="70" stroke="#D4A574" stroke-width="1"/>
    <line x1="770" y1="70" x2="770" y2="100" stroke="#D4A574" stroke-width="1"/>
    
    <!-- Bottom right -->
    <line x1="740" y1="220" x2="770" y2="220" stroke="#D4A574" stroke-width="1"/>
    <line x1="770" y1="190" x2="770" y2="220" stroke="#D4A574" stroke-width="1"/>
  </g>
</svg>
