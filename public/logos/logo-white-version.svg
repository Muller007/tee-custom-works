<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&display=swap');
    </style>
    
    <radialGradient id="bgGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FAFAF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E3;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9925D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8814A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offsetblur" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Circle Background (White/Cream) -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" filter="url(#softShadow)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#D4A574" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Inner Decorative Elements -->
  <!-- Top left accent -->
  <circle cx="120" cy="65" r="8" fill="#D4A574" opacity="0.3"/>
  <circle cx="120" cy="65" r="6" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.8"/>
  
  <!-- Bottom right accent -->
  <circle cx="85" cy="135" r="8" fill="#D4A574" opacity="0.3"/>
  <circle cx="85" cy="135" r="6" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.8"/>
  
  <!-- Geometric Kitchen Element -->
  <g opacity="0.12">
    <!-- Knife blade -->
    <path d="M 100 50 L 108 90 L 100 95 L 92 90 Z" fill="#8B7355"/>
    <!-- Knife handle -->
    <rect x="97" y="100" width="6" height="20" fill="#8B7355" rx="2"/>
  </g>
  
  <!-- Main Text: "TEE" -->
  <text x="100" y="115" font-family="Playfair Display, serif" font-size="52" font-weight="700" 
        text-anchor="middle" fill="#8B7355" letter-spacing="3">
    TEE
  </text>
  
  <!-- Decorative Line Above -->
  <line x1="60" y1="45" x2="140" y2="45" stroke="#D4A574" stroke-width="1.5" opacity="0.6"/>
  <circle cx="60" cy="45" r="2" fill="#D4A574"/>
  <circle cx="140" cy="45" r="2" fill="#D4A574"/>
  
  <!-- Decorative Line Below -->
  <line x1="65" y1="155" x2="135" y2="155" stroke="#D4A574" stroke-width="1.5" opacity="0.6"/>
  <circle cx="65" cy="155" r="2" fill="#D4A574"/>
  <circle cx="135" cy="155" r="2" fill="#D4A574"/>
  
  <!-- Subtitle: "CUSTOM KITCHENS" -->
  <text x="100" y="175" font-family="Cormorant, serif" font-size="9" font-weight="300"
        text-anchor="middle" fill="#8B7355" letter-spacing="2" opacity="0.9">
    CUSTOM KITCHENS
  </text>
  
  <!-- Premium corner details -->
  <!-- Top left corner -->
  <g opacity="0.3">
    <line x1="20" y1="20" x2="30" y2="20" stroke="#D4A574" stroke-width="1"/>
    <line x1="20" y1="20" x2="20" y2="30" stroke="#D4A574" stroke-width="1"/>
  </g>
  
  <!-- Top right corner -->
  <g opacity="0.3">
    <line x1="170" y1="20" x2="180" y2="20" stroke="#D4A574" stroke-width="1"/>
    <line x1="180" y1="20" x2="180" y2="30" stroke="#D4A574" stroke-width="1"/>
  </g>
  
  <!-- Bottom left corner -->
  <g opacity="0.3">
    <line x1="20" y1="170" x2="20" y2="180" stroke="#D4A574" stroke-width="1"/>
    <line x1="20" y1="180" x2="30" y2="180" stroke="#D4A574" stroke-width="1"/>
  </g>
  
  <!-- Bottom right corner -->
  <g opacity="0.3">
    <line x1="170" y1="180" x2="180" y2="180" stroke="#D4A574" stroke-width="1"/>
    <line x1="180" y1="170" x2="180" y2="180" stroke="#D4A574" stroke-width="1"/>
  </g>
</svg>
